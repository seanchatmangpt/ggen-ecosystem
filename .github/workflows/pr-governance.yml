name: PR Governance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-authority:
    name: Source authority, syntax, and Chicago
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Assert exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "REFUSED[HEAD_DRIFT]: expected=$EXPECTED_HEAD actual=$actual" >&2
            exit 1
          }
      - name: Compile Python control surfaces
        run: python3 -m compileall -q scripts tests
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts tests -type f -name '*.sh' -print0)
      - name: Verify supply-chain evidence bundle court
        run: python3 tools/verify_supply_chain_bundle.py
      - name: Refuse direct edits to generated sync projection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          generated=0
          authoritative=0
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/ggen-ecosystem-sync.yml) generated=1 ;;
            esac
            case "$path" in
              ontology.ttl|ggen.toml|ggen.lock|ontology/*|vendor/ggen-marketplace/*) authoritative=1 ;;
            esac
          done
          if (( generated && ! authoritative )); then
            echo 'REFUSED[GENERATED_PROJECTION_DIRECT_EDIT]: generated sync workflow changed without authoritative generator input.' >&2
            exit 1
          fi
          echo 'PARTIAL_ALIVE[PR_GOVERNANCE]: source-authority and syntax admitted; Chicago execution remains separate.'
      - name: Execute exact-head Chicago consumer
        shell: bash
        env:
          CHICAGO_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
          CHICAGO_EVIDENCE_PATH: ${{ runner.temp }}/chicago-evidence.json
        run: bash tests/chicago_consumer.sh
      - name: Upload Chicago execution evidence
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: chicago-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/chicago-evidence.json
          if-no-files-found: ignore
