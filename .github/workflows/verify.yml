name: verify ecosystem

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse TOML
        run: |
          python - <<'PY'
          import pathlib, tomllib
          for p in pathlib.Path('.').rglob('*.toml'):
              with p.open('rb') as f:
                  tomllib.load(f)
              print('TOML_OK', p)
          PY
      - name: Parse Turtle
        run: |
          python -m pip install --disable-pip-version-check rdflib pyshacl
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          for p in Path('.').rglob('*.ttl'):
              Graph().parse(p, format='turtle')
              print('TTL_OK', p)
          PY
      - name: Validate SHACL admission shapes
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          from pyshacl import validate
          data = Graph()
          for p in [Path('ecosystem.ttl'), *sorted(Path('ontology').glob('*.ttl')), *sorted(Path('profiles').glob('*.ttl')), *sorted(Path('admission').glob('*.ttl'))]:
              data.parse(p, format='turtle')
          shapes = Graph().parse('admission/shapes.ttl', format='turtle')
          conforms, _, report = validate(data, shacl_graph=shapes, inference='rdfs')
          print(report)
          assert conforms
          PY
      - name: Execute local ecosystem falsifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          g = Graph()
          for p in [Path('ecosystem.ttl'), *sorted(Path('ontology').glob('*.ttl')), *sorted(Path('profiles').glob('*.ttl')), *sorted(Path('admission').glob('*.ttl'))]:
              g.parse(p, format='turtle')
          for q in ['queries/publication-fence.rq', 'queries/premature-admission.rq', 'queries/profile-reference-closure.rq']:
              rows = list(g.query(Path(q).read_text()))
              print('FALSIFIER', q, 'rows=', len(rows))
              assert not rows, (q, rows[:10])
          PY
      - name: Verify locked SHAs are full identities
        run: |
          python - <<'PY'
          import re, tomllib
          with open('ecosystem.lock.toml','rb') as f:
              d=tomllib.load(f)
          for name, row in d['repositories'].items():
              assert re.fullmatch(r'[0-9a-f]{40}', row['sha']), (name, row['sha'])
              print('LOCK_OK', name, row['sha'])
          PY

  ggen-exact-subject:
    runs-on: ubuntu-latest
    needs: static-admission
    steps:
      - name: Checkout ecosystem exact subject
        uses: actions/checkout@v4
        with:
          path: ggen-ecosystem

      - name: Read exact dependency lock
        id: lock
        working-directory: ggen-ecosystem
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('ecosystem.lock.toml','rb') as f:
              d=tomllib.load(f)
          print('ggen_sha=' + d['repositories']['ggen']['sha'])
          print('marketplace_sha=' + d['repositories']['ggen-marketplace']['sha'])
          PY

      - name: Checkout locked ggen
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: ${{ steps.lock.outputs.ggen_sha }}
          path: ggen

      - name: Checkout locked marketplace
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen-marketplace
          ref: ${{ steps.lock.outputs.marketplace_sha }}
          path: ggen-marketplace

      - name: Execute exact marketplace DfCM gates
        working-directory: ggen-ecosystem
        run: |
          python -m pip install --disable-pip-version-check rdflib
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          g = Graph()
          sources = [Path('ecosystem.ttl'), *sorted(Path('ontology').glob('*.ttl')), *sorted(Path('profiles').glob('*.ttl')), *sorted(Path('admission').glob('*.ttl'))]
          for p in sources:
              g.parse(p, format='turtle')
          g.parse('../ggen-marketplace/packs/ggen-combinatorial-maximalism-pack/ontology.ttl', format='turtle')
          gates = Path('../ggen-marketplace/packs/ggen-combinatorial-maximalism-pack/gates')
          for p in sorted(gates.glob('*.rq')):
              result = g.query(p.read_text())
              if getattr(result, 'askAnswer', None) is not None:
                  violated = bool(result.askAnswer)
                  detail = f'ask={violated}'
              else:
                  rows = list(result)
                  violated = bool(rows)
                  detail = f'rows={len(rows)}'
              print('PACK_GATE', p.name, detail)
              assert not violated, f'{p.name} refused the ecosystem graph: {detail}'
          PY

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-22

      - name: Build exact ggen manufacturer
        working-directory: ggen
        run: cargo build -p ggen-cli-lib --bin ggen

      - name: Execute exact-subject sync
        working-directory: ggen-ecosystem
        run: ../ggen/target/debug/ggen sync run

      - name: Verify receipt chain
        working-directory: ggen-ecosystem
        run: ../ggen/target/debug/ggen receipt verify

      - name: Execute DfCM verifier when manufactured
        working-directory: ggen-ecosystem
        run: |
          if test -f consumer/dfcm/verify_dfcm.py; then
            python consumer/dfcm/verify_dfcm.py
          else
            echo "REFUSED:dfcm-verifier-not-manufactured"
            exit 1
          fi

      - name: Verify deterministic second sync
        working-directory: ggen-ecosystem
        run: ../ggen/target/debug/ggen sync run --dry-run
