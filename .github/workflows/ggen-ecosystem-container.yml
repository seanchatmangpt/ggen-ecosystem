name: GGen Ecosystem Container Build & Publish
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish the composed image under
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'


permissions:
  contents: read

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    name: Build and push linux/amd64 image

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
        
      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          registry: ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (act-local, no push)
        if: ${{ env.ACT }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          tags: ggen-ecosystem:local-amd64
          platforms: linux/amd64
          push: false
          load: true
          context: .

      - name: Build and push linux/amd64
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          tags: ghcr.io/seanchatmangpt/ggen-ecosystem:${{ inputs.image_tag || github.ref_name }}-amd64
          cache-to: type=gha,mode=max,scope=ggen-ecosystem-amd64
          cache-from: type=gha,scope=ggen-ecosystem-amd64
          provenance: true
          sbom: true
          platforms: linux/amd64
          push: true
          context: .

  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    name: Build and push linux/arm64 image

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
        
      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          registry: ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (act-local, no push)
        if: ${{ env.ACT }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          tags: ggen-ecosystem:local-arm64
          platforms: linux/arm64
          push: false
          load: true
          context: .

      - name: Build and push linux/arm64
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          tags: ghcr.io/seanchatmangpt/ggen-ecosystem:${{ inputs.image_tag || github.ref_name }}-arm64
          cache-to: type=gha,mode=max,scope=ggen-ecosystem-arm64
          cache-from: type=gha,scope=ggen-ecosystem-arm64
          provenance: true
          sbom: true
          platforms: linux/arm64
          push: true
          context: .

  merge-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-arm64,build-amd64]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    name: Merge into one multi-arch manifest

    steps:
      # Manifest creation only makes sense against a real registry push (both
      # arch builds run act-local, no-push, when env.ACT is set — see
      # build-amd64/build-arm64). Note: the `env` context is NOT available in
      # a job-level `if:` (GitHub Actions context-availability table), so this
      # is guarded per-step instead of on the job.
      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          registry: ghcr.io

      - name: Create and push multi-arch manifest
        if: ${{ !env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag || github.ref_name }}"
          docker buildx imagetools create \
            -t "ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}" \
            -t "ghcr.io/seanchatmangpt/ggen-ecosystem:latest" \
            "ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}-amd64" \
            "ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}-arm64"
          docker buildx imagetools inspect "ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}"

      - name: Skip manifest merge under act (local-only images, no registry)
        if: ${{ env.ACT }}
        shell: bash
        run: |
          echo "ACT=true, skipping registry manifest merge."
          echo "build-amd64/build-arm64 already produced local-only images ggen-ecosystem:local-amd64 and ggen-ecosystem:local-arm64."


      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        
      - name: Sign multi-arch manifest keylessly (cosign + GitHub OIDC)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag || github.ref_name }}"
          IMAGE="ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}" --format "{{json .Manifest}}" | jq -r '.digest')
          echo "Signing ${IMAGE}@${DIGEST} keylessly via GitHub OIDC (no signing key in this repo)"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          

      - name: Run Trivy vulnerability scanner on published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          output: trivy-results.sarif
          format: sarif
          image-ref: ghcr.io/seanchatmangpt/ggen-ecosystem:${{ inputs.image_tag || github.ref_name }}
        
      - name: Upload Trivy scan results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
        
