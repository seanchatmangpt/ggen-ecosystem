name: GGen Ecosystem Container Build & Publish
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish the composed image under
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'


permissions:
  contents: read

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    name: Build and push linux/amd64 image

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
        
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          registry: ghcr.io
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        
      - name: Build and push linux/amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          tags: ghcr.io/seanchatmangpt/ggen-ecosystem:${{ inputs.image_tag || github.ref_name }}-amd64
          cache-to: type=gha,mode=max,scope=ggen-ecosystem-amd64
          cache-from: type=gha,scope=ggen-ecosystem-amd64
          provenance: true
          sbom: true
          platforms: linux/amd64
          push: true
          context: .
        
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    name: Build and push linux/arm64 image

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
        
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          registry: ghcr.io
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        
      - name: Build and push linux/arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          tags: ghcr.io/seanchatmangpt/ggen-ecosystem:${{ inputs.image_tag || github.ref_name }}-arm64
          cache-to: type=gha,mode=max,scope=ggen-ecosystem-arm64
          cache-from: type=gha,scope=ggen-ecosystem-arm64
          provenance: true
          sbom: true
          platforms: linux/arm64
          push: true
          context: .
        
  merge-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-arm64,build-amd64]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    name: Merge into one multi-arch manifest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          registry: ghcr.io
        
      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag || github.ref_name }}"
          docker buildx imagetools create \
            -t "ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}" \
            -t "ghcr.io/seanchatmangpt/ggen-ecosystem:latest" \
            "ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}-amd64" \
            "ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}-arm64"
          docker buildx imagetools inspect "ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}"
          

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        
      - name: Sign multi-arch manifest keylessly (cosign + GitHub OIDC)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag || github.ref_name }}"
          IMAGE="ghcr.io/seanchatmangpt/ggen-ecosystem:${TAG}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}" --format "{{json .Manifest}}" | jq -r '.digest')
          echo "Signing ${IMAGE}@${DIGEST} keylessly via GitHub OIDC (no signing key in this repo)"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          

      - name: Run Trivy vulnerability scanner on published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          output: trivy-results.sarif
          format: sarif
          image-ref: ghcr.io/seanchatmangpt/ggen-ecosystem:${{ inputs.image_tag || github.ref_name }}
        
      - name: Upload Trivy scan results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
        
