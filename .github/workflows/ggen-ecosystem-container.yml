name: GGen Ecosystem Container Build & Publish
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish the composed image under
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'


permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    name: Build and publish composed ggen-ecosystem container

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
        
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          registry: ghcr.io
        
      - name: Build and push composed image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          tags: ghcr.io/seanchatmangpt/ggen-ecosystem:${{ inputs.image_tag || github.ref_name }},ghcr.io/seanchatmangpt/ggen-ecosystem:latest
          push: true
          context: .
        
