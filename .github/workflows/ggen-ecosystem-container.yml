name: GGen Ecosystem Container Build & Publish
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish the composed image under
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'


permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    name: Build and publish composed ggen-ecosystem container

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
        
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          registry: ghcr.io
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        
      - name: Build and push composed image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          tags: ghcr.io/seanchatmangpt/ggen-ecosystem:${{ inputs.image_tag || github.ref_name }},ghcr.io/seanchatmangpt/ggen-ecosystem:latest
          platforms: linux/amd64,linux/arm64
          push: true
          context: .
        
