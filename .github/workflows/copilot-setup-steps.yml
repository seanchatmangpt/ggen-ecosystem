name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-instructions.md
      - .github/instructions/**
      - .github/agents/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-instructions.md
      - .github/instructions/**
      - .github/agents/**

permissions:
  contents: read

jobs:
  # GitHub Copilot cloud agent requires this exact job identifier.
  copilot-setup-steps:
    name: Prepare deterministic contributor environment
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject and ecosystem submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Prime repository facts
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          python3 scripts/github_dx_check.py --root .
          python3 -m unittest tests.lock_contracts.test_ecosystem_lock_consistency -v
          python3 -m unittest tests.test_mfact_certification -v

      - name: Refuse setup mutation
        run: git diff --exit-code
