name: Real Chicago Consumer Matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  chicago:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit official GGen release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ggen.tar.gz" https://github.com/seanchatmangpt/ggen/releases/download/v26.8.28/ggen-x86_64-unknown-linux-gnu.tar.gz
          echo 'ccb9fe78ef0c84d8b240b45beb6e73f47e2c930d5db3efcf9a0e58dfe071d313  '${RUNNER_TEMP}'/ggen.tar.gz' | sha256sum -c -
          tar --no-same-owner -xzf "$RUNNER_TEMP/ggen.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/ggen" --version | grep -Fx 'ggen 26.8.28'
      - name: Execute all real Chicago consumers twice
        shell: bash
        run: |
          set -o pipefail
          python3 tools/chicago_consumer_matrix.py --ggen "$RUNNER_TEMP/ggen" --all --json | tee "$RUNNER_TEMP/chicago-consumer-receipt.json"
      - name: Upload execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chicago-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chicago-consumer-receipt.json
          if-no-files-found: error
