name: Real Chicago Consumer Matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chicago:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate with recursive submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Prove exact subject identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git submodule status --recursive
          echo "EXACT_SUBJECT_ALIVE=$EXPECTED_SHA"

      - name: Admit immutable published release image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          with open('ecosystem.lock.toml', 'rb') as f:
              lock = tomllib.load(f)
          c = lock['container']
          print(f"IMAGE={c['repository']}@{c['digest']}")
          print(f"GGEN_SHA256={lock['ggen']['linux_x86_64_asset_sha256']}")
          PY

      - name: Pull immutable digest and prove network-isolated runtime identity
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          VERSION="$(docker run --rm --network none "$IMAGE" ggen --version)"
          test "$VERSION" = "ggen 26.9.9"
          docker tag "$IMAGE" ggen-ecosystem:test
          echo "IMMUTABLE_RELEASE_RUNTIME_ALIVE=$VERSION"

      - name: Run exact container Chicago court
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_container_smoke.sh
          echo "CHICAGO_ALIVE=exit-0"

      - name: Admit exact upstream ggen binary for doctor and DOD
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ggen.tar.gz" \
            https://github.com/seanchatmangpt/ggen/releases/download/v26.9.9/ggen-x86_64-unknown-linux-gnu.tar.gz
          echo "$GGEN_SHA256  $RUNNER_TEMP/ggen.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$RUNNER_TEMP/ggen.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/ggen" --version | grep -Fx 'ggen 26.9.9'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run doctor and require every gate ALIVE
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/doctor.sh --json | tee "$RUNNER_TEMP/doctor.jsonl"
          python3 - "$RUNNER_TEMP/doctor.jsonl" <<'PY'
          import json, sys
          lines = [x.strip() for x in open(sys.argv[1], encoding='utf-8') if x.strip().startswith('{')]
          if not lines:
              raise SystemExit('doctor emitted no JSON receipt')
          doc = json.loads(lines[-1])
          gates = doc.get('gates', [])
          if not gates:
              raise SystemExit('doctor emitted zero gates')
          bad = [g for g in gates if g.get('standing') != 'ALIVE']
          if bad:
              print(json.dumps(bad, indent=2))
              raise SystemExit('doctor not fully ALIVE')
          print(f"DOCTOR_ALIVE={len(gates)}/{len(gates)}")
          PY

      - name: Run DOD theorem and require ALIVE exact head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/dod_engine.py | tee "$RUNNER_TEMP/dod.txt"
          grep -F "seanchatmangpt/ggen-ecosystem@$EXPECTED_SHA" "$RUNNER_TEMP/dod.txt"
          grep -F 'STATUS: ALIVE' "$RUNNER_TEMP/dod.txt"

      - name: Validate historical receipt and run mfact court
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-receipt.sh receipts/release-v26.9.10-container.json
          python3 scripts/certify_ecosystem.py --root .
