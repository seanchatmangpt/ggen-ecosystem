name: PragProg TPS Automatic Andon

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict:
        description: Fail when PragProg courts find abnormalities
        required: true
        type: boolean
        default: false

concurrency:
  group: pragprog-tps-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  court:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize exact TPS pack only
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 vendor/ggen-marketplace
      - name: Install exact GGen release
        shell: bash
        run: |
          ./tps/install-ggen.sh
      - name: Execute automatic PragProg TPS
        env:
          STRICT: ${{ inputs.strict }}
        shell: bash
        run: |
          ./tps/run.sh
      - name: Upload TPS andon evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pragprog-tps-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pragprog-tps/
          if-no-files-found: error
          retention-days: 14
