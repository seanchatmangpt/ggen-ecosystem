name: Operator Redundancy Court

on:
  pull_request:
    paths:
      - "packs/operator-redundancy-pack/**"
      - "tests/fixtures/operator-redundancy/**"
      - "scripts/test-operator-redundancy.sh"
      - "docs/operator-redundancy.md"
      - ".github/workflows/operator-redundancy-court.yml"
  push:
    branches: [main]
    paths:
      - "packs/operator-redundancy-pack/**"
      - "tests/fixtures/operator-redundancy/**"
      - "scripts/test-operator-redundancy.sh"
      - "docs/operator-redundancy.md"
      - ".github/workflows/operator-redundancy-court.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-operator-redundancy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact-head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "EXACT_HEAD_ALIVE $actual"

      - name: Prove named-human-free operation with constitutional boundary
        env:
          GGEN_ECOSYSTEM_CACHE: ${{ runner.temp }}/ggen-ecosystem-cache
        run: ./scripts/test-operator-redundancy.sh
