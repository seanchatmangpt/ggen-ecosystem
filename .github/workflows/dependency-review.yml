name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency delta when GitHub graph is available
    runs-on: ubuntu-24.04
    steps:
      - id: capability
        name: Probe GitHub dependency-graph capability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}"
          status="$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/dependency-graph.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$endpoint")"
          case "$status" in
            200)
              echo 'supported=true' >> "$GITHUB_OUTPUT"
              echo 'ALIVE[DEPENDENCY_GRAPH_AVAILABLE]'
              ;;
            403|404)
              echo 'supported=false' >> "$GITHUB_OUTPUT"
              echo "UNSUPPORTED[DEPENDENCY_GRAPH_DISABLED]:http=$status"
              ;;
            *)
              echo "BUILD_BROKEN[DEPENDENCY_GRAPH_PROBE]:http=$status" >&2
              cat "$RUNNER_TEMP/dependency-graph.json" >&2 || true
              exit 1
              ;;
          esac

      - name: Reject newly introduced vulnerable dependencies
        if: ${{ steps.capability.outputs.supported == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          warn-only: false

      - name: Preserve unsupported standing
        if: ${{ steps.capability.outputs.supported != 'true' }}
        run: |
          echo 'UNSUPPORTED[DEPENDENCY_GRAPH_DISABLED] — enable the repository Dependency graph to activate the vulnerability delta gate.'
