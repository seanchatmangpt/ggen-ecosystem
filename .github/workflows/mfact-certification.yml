name: MFact Certification Court

# Independent verifier workflow. Unlike ggen-ecosystem-sync.yml and
# ggen-ecosystem-container.yml, this file is not a manufactured projection and
# has no CONSTRUCT/DO authority. It only checks already-present evidence.
on:
  pull_request:
    branches: [main]
    paths:
      - "certification/**"
      - "scripts/certify_ecosystem.py"
      - "tests/test_mfact_certification.py"
      - "tests/lock_contracts/**"
      - "ecosystem.lock.toml"
      - "ggen.toml"
      - "ontology.ttl"
      - "Dockerfile"
      - "docs/CURRENT-RELEASE-STANDING.md"
      - "receipts/release-v26.8.28-container.json"
      - ".github/workflows/ggen-ecosystem-sync.yml"
      - ".github/workflows/ggen-ecosystem-container.yml"
      - ".github/workflows/mfact-certification.yml"
  push:
    branches: [main]
    paths:
      - "certification/**"
      - "scripts/certify_ecosystem.py"
      - "tests/test_mfact_certification.py"
      - "tests/lock_contracts/**"
      - "ecosystem.lock.toml"
      - "ggen.toml"
      - "ontology.ttl"
      - "Dockerfile"
      - "docs/CURRENT-RELEASE-STANDING.md"
      - "receipts/release-v26.8.28-container.json"
      - ".github/workflows/ggen-ecosystem-sync.yml"
      - ".github/workflows/ggen-ecosystem-container.yml"
      - ".github/workflows/mfact-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfact-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Artifact ledger → evidence → scoped standing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject with ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          [[ "$actual" = "$expected" ]] || {
            echo "REFUSED[EXACT_HEAD_MISMATCH]:actual=$actual:expected=$expected" >&2
            exit 2
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify lock, gitlink, and blocked-capsule correspondence
        run: python3 -m unittest tests.lock_contracts.test_ecosystem_lock_consistency -v

      - name: Run certification falsifiers
        run: python3 -m unittest tests.test_mfact_certification -v

      - name: Certify bounded ecosystem standing
        run: |
          set -euo pipefail
          python3 scripts/certify_ecosystem.py \
            --root . \
            --receipt "$RUNNER_TEMP/mfact-certification.json"
          python3 -m json.tool "$RUNNER_TEMP/mfact-certification.json" >/dev/null

      - name: Preserve certification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mfact-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mfact-certification.json
          if-no-files-found: error
          retention-days: 30

      - name: Refuse verifier mutation
        run: git diff --exit-code
