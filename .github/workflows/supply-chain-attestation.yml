name: Supply Chain Attestation

on:
  workflow_call:
    inputs:
      subject_name:
        description: Fully-qualified artifact/image subject name; container names must not include a tag.
        type: string
        required: true
      subject_digest:
        description: Immutable SHA-256 digest in sha256:<64 lowercase hex> form.
        type: string
        required: true
      push_to_registry:
        description: Also publish the attestation to the OCI registry.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      subject_name:
        description: Fully-qualified artifact/image subject name; container names must not include a tag.
        type: string
        required: true
      subject_digest:
        description: Immutable SHA-256 digest in sha256:<64 lowercase hex> form.
        type: string
        required: true
      push_to_registry:
        description: Also publish the attestation to the OCI registry.
        type: boolean
        required: true
        default: false

permissions: {}

jobs:
  validate:
    name: Admit immutable subject
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      name: ${{ steps.subject.outputs.name }}
      digest: ${{ steps.subject.outputs.digest }}
    steps:
      - id: subject
        name: Validate subject identity
        shell: bash
        env:
          SUBJECT_NAME: ${{ inputs.subject_name }}
          SUBJECT_DIGEST: ${{ inputs.subject_digest }}
        run: |
          set -euo pipefail
          [[ -n "$SUBJECT_NAME" ]] || { echo 'REFUSED[ATTEST_SUBJECT_NAME_EMPTY]' >&2; exit 2; }
          [[ "$SUBJECT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "REFUSED[ATTEST_SUBJECT_DIGEST_INVALID]:$SUBJECT_DIGEST" >&2
            exit 2
          }
          echo "name=$SUBJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$SUBJECT_DIGEST" >> "$GITHUB_OUTPUT"

  attest:
    name: Record GitHub/Sigstore provenance
    if: ${{ !inputs.push_to_registry }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Attest immutable subject
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.validate.outputs.name }}
          subject-digest: ${{ needs.validate.outputs.digest }}
          show-summary: true

  attest-registry:
    name: Record and publish OCI provenance
    if: ${{ inputs.push_to_registry }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Attest immutable OCI subject
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.validate.outputs.name }}
          subject-digest: ${{ needs.validate.outputs.digest }}
          push-to-registry: true
          show-summary: true
