name: GGen Ecosystem Contract Verifier
on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Verify manifest-present
        run: |
          test -f ggen.toml

      - name: Verify ontology-present
        run: |
          test -f ontology.ttl

      - name: Verify lock-present
        run: |
          test -f ggen.lock

      - name: Verify ecosystem-ontology-present
        run: |
          test -f ecosystem.ttl

