version: 2
updates:
  # GitHub Actions are exact-SHA pinned. Dependabot surfaces upstream movement as a review signal.
  # GGen-generated workflow pins must be repaired at their semantic/template source and regenerated;
  # a Dependabot PR against generated YAML is never itself authority to hand-edit the projection.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Submodule movement changes exact producer identity and must never auto-merge.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(submodules)"
