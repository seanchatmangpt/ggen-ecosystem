version: 2
updates:
  # .github/workflows/ggen-ecosystem-sync.yml is GENERATED from authoritative
  # GGen inputs. Dependabot changes to that projection are drift signals only;
  # the PR governance gate refuses a direct generated-only edit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      submodules:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(submodules)"
