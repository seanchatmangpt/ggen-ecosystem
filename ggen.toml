[project]
name = "ggen-ecosystem"

[ontology]
source = "ontology.ttl"
imports = [
  "github-local-runtime.ttl",
  "github-local-runtime-2026-deltas.ttl",
  "vendor/ggen-marketplace/packs/github-actions-pack/reference/local-runtime-ontology.ttl",
]

[packs]
# Sourced from the exact vendor/ggen-marketplace git submodule, not a floating
# package fetch. ecosystem.lock.toml binds the producer commit consumed here.
github-actions = { path = "vendor/ggen-marketplace/packs/github-actions-pack" }

[templates]
dir = "templates"
