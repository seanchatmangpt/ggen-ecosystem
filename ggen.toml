[project]
name = "ggen-ecosystem"

[ontology]
source = "ontology.ttl"

[packs]
# Sourced from the real vendor/ggen-marketplace git submodule (pinned commit
# 616e93d1e6f9566e4b5eb4e2c3d1400746786e50 -- see [submodules] in ecosystem.lock.toml),
# not a git+version fetch -- confirmed schema via ggen's own
# crates/ggen-config/src/config_schema.rs test `[packs.mypack] path = "../mypack"`.
# The comment SHA above is asserted against the lock by
# tests/lock_contracts/test_ecosystem_lock_consistency.py
# (test_ggen_toml_packs_comment_marketplace_sha_matches_lock) -- the drift class
# fixed in #248/#263/#266/#267 is now a permanent tripwire, not a recurring patch.
github-actions = { path = "vendor/ggen-marketplace/packs/github-actions-pack" }

[templates]
dir = "templates"
