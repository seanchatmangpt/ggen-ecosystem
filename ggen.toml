[project]
name = "ggen-ecosystem"

[ontology]
source = "ontology.ttl"

[packs]
# Sourced from the real vendor/ggen-marketplace git submodule -- the pinned
# commit lives in [submodules] of ecosystem.lock.toml, not a git+version fetch
# -- confirmed schema via ggen's own
# crates/ggen-config/src/config_schema.rs test `[packs.mypack] path = "../mypack"`.
# No commit SHA is cited in this comment on purpose: the crown's
# authorized-path gate forbids ggen.toml edits, so a cited SHA could not
# follow a crown bump and would rot. The comment-vs-pin drift class fixed in
# #248/#263/#266/#267 stays tripped by
# tests/lock_contracts/test_ecosystem_lock_consistency.py
# (test_ggen_toml_packs_comment_marketplace_sha_matches_lock), which fails
# if this comment ever cites a SHA other than the pinned marketplace commit.
github-actions = { path = "vendor/ggen-marketplace/packs/github-actions-pack" }

[templates]
dir = "templates"
